<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep Ocean – Jellyfish</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let mouseX = -9999, mouseY = -9999, mouseActive = false;
window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; mouseActive = true; });
window.addEventListener('mouseleave', () => { mouseActive = false; });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t0 = e.touches[0];
  mouseX = t0.clientX; mouseY = t0.clientY; mouseActive = true;
}, { passive: false });
canvas.addEventListener('touchend', () => { mouseActive = false; });

const TAU   = Math.PI * 2;
const rand  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const hsla  = (h, s, l, a) => `hsla(${h|0},${s|0}%,${l|0}%,${+a.toFixed(3)})`;

function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
function hash2(ix, iy) {
  let h = (ix * 1619 + iy * 31337 + 1013904223) | 0;
  h = Math.imul(h ^ (h >>> 16), 0x45d9f3b);
  h = Math.imul(h ^ (h >>> 16), 0x45d9f3b);
  return ((h ^ (h >>> 16)) & 0x7fffffff) / 0x7fffffff;
}
function noise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fade(fx), uy = fade(fy);
  const a = hash2(ix,iy), b = hash2(ix+1,iy);
  const c = hash2(ix,iy+1), d = hash2(ix+1,iy+1);
  return a + (b-a)*ux + (c-a)*uy + (a-b-c+d)*ux*uy;
}

const RAY_OFFSETS = Array.from({ length: 8 }, () => rand(0, TAU));

function drawBackground(t) {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0,    '#081a35');
  bg.addColorStop(0.22, '#061530');
  bg.addColorStop(0.6,  '#040e22');
  bg.addColorStop(1,    '#020710');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const surf = ctx.createLinearGradient(0, 0, 0, H * 0.18);
  surf.addColorStop(0, 'rgba(15,60,160,0.22)');
  surf.addColorStop(1, 'rgba(15,60,160,0)');
  ctx.fillStyle = surf;
  ctx.fillRect(0, 0, W, H * 0.18);

  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 11; i++) {
    const nx = noise2(i * 0.41 + t * 0.038, 0.1) * W;
    const ny = noise2(i * 0.41, t * 0.031 + 0.5) * H * 0.38;
    const nr = 14 + noise2(i * 0.3, t * 0.022 + 1.0) * 58;
    const cg = ctx.createRadialGradient(nx, ny, 0, nx, ny, nr);
    cg.addColorStop(0,   'rgba(90,190,255,0.055)');
    cg.addColorStop(0.5, 'rgba(70,170,240,0.022)');
    cg.addColorStop(1,   'rgba(50,140,220,0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(nx, ny, nr, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < RAY_OFFSETS.length; i++) {
    const off   = RAY_OFFSETS[i];
    const ox    = W * (0.1 + (i / RAY_OFFSETS.length) * 0.8);
    const slant = Math.sin(t * 0.065 + off) * 0.075 * W;
    const hw    = W * (0.035 + 0.014 * Math.sin(t * 0.1 + off));
    const rayG  = ctx.createLinearGradient(ox, 0, ox + slant, H * 0.62);
    rayG.addColorStop(0,   'rgba(80,160,255,0.055)');
    rayG.addColorStop(0.5, 'rgba(60,140,230,0.022)');
    rayG.addColorStop(1,   'rgba(40,100,200,0)');
    ctx.beginPath();
    ctx.moveTo(ox - hw, 0);
    ctx.lineTo(ox + hw, 0);
    ctx.lineTo(ox + slant + hw*1.6, H * 0.62);
    ctx.lineTo(ox + slant - hw*1.6, H * 0.62);
    ctx.closePath();
    ctx.fillStyle = rayG;
    ctx.fill();
  }
  ctx.restore();

  const vig = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.25, W/2, H/2, Math.max(W,H)*0.82);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,4,18,0.58)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  const abyss = ctx.createLinearGradient(0, H * 0.70, 0, H);
  abyss.addColorStop(0, 'rgba(0,2,10,0)');
  abyss.addColorStop(1, 'rgba(0,2,10,0.82)');
  ctx.fillStyle = abyss;
  ctx.fillRect(0, H * 0.70, W, H * 0.30);
}

class Particle {
  constructor(init = false) { this.reset(init); }
  reset(init = false) {
    this.x = rand(0, W); this.y = init ? rand(0, H) : H + rand(5, 25);
    this.r = rand(0.5, 2.3); this.vx = rand(-0.18, 0.18); this.vy = -rand(0.07, 0.32);
    this.hue = rand(160, 240); this.alpha = rand(0.12, 0.52);
    this.twink = rand(0, TAU); this.twinkS = rand(0.012, 0.042);
  }
  update() { this.x += this.vx; this.y += this.vy; this.twink += this.twinkS; if (this.y < -6) this.reset(); }
  draw() {
    const a = this.alpha * (0.5 + 0.5 * Math.sin(this.twink));
    ctx.save(); ctx.globalAlpha = a;
    ctx.shadowColor = hsla(this.hue, 100, 78, 1); ctx.shadowBlur = this.r * 6;
    ctx.fillStyle = hsla(this.hue, 90, 82, 1);
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

class Bubble {
  constructor() { this.reset(true); }
  reset(init = false) {
    this.x = rand(0, W); this.y = init ? rand(0, H) : H + 10;
    this.r = rand(1.5, 5.5); this.vx = rand(-0.1, 0.1); this.vy = -rand(0.28, 0.75);
    this.alpha = rand(0.04, 0.18); this.phase = rand(0, TAU);
  }
  update(t) { this.x += this.vx + Math.sin(t * 1.1 + this.phase) * 0.14; this.y += this.vy; if (this.y < -12) this.reset(); }
  draw() {
    ctx.save(); ctx.globalAlpha = this.alpha;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, TAU);
    ctx.strokeStyle = 'rgba(160,210,255,1)'; ctx.lineWidth = 0.8; ctx.stroke();
    ctx.beginPath(); ctx.arc(this.x - this.r*0.28, this.y - this.r*0.28, this.r*0.28, 0, TAU);
    ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
    ctx.restore();
  }
}

class Chain {
  constructor(n, segLen, width, hue) {
    this.n = n; this.segLen = segLen; this.width = width; this.hue = hue;
    this.ax = 0; this.ay = 0; this.pts = [];
    for (let i = 0; i < n; i++) this.pts.push({ x: 0, y: i * segLen, px: 0, py: i * segLen });
  }
  setAnchor(ax, ay) { this.ax = ax; this.ay = ay; this.pts[0].x = ax; this.pts[0].y = ay; }
  update(windX = 0) {
    const GRAV = 0.065, DAMP = 0.972, ITER = 3;
    for (let i = 1; i < this.n; i++) {
      const p = this.pts[i];
      const vx = (p.x - p.px) * DAMP + windX * 0.0013;
      const vy = (p.y - p.py) * DAMP;
      p.px = p.x; p.py = p.y; p.x += vx; p.y += vy + GRAV;
    }
    for (let it = 0; it < ITER; it++) {
      this.pts[0].x = this.ax; this.pts[0].y = this.ay;
      for (let i = 1; i < this.n; i++) {
        const a = this.pts[i-1], b = this.pts[i];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.sqrt(dx*dx + dy*dy) || 1e-6;
        const c = (d - this.segLen) / d * 0.5;
        if (i > 1) { a.x += dx * c; a.y += dy * c; }
        b.x -= dx * c; b.y -= dy * c;
      }
    }
  }
  draw() {
    if (this.n < 2) return;
    const pts = this.pts, last = pts[this.n - 1];
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < this.n - 1; i++)
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, (pts[i].x+pts[i+1].x)*0.5, (pts[i].y+pts[i+1].y)*0.5);
    ctx.lineTo(last.x, last.y);
    const gG = ctx.createLinearGradient(pts[0].x, pts[0].y, last.x, last.y);
    gG.addColorStop(0, hsla(this.hue, 82, 74, 0.22)); gG.addColorStop(1, hsla(this.hue, 82, 74, 0));
    ctx.strokeStyle = gG; ctx.lineWidth = this.width * 4;
    ctx.shadowColor = hsla(this.hue, 90, 80, 0.7); ctx.shadowBlur = 10; ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < this.n - 1; i++)
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, (pts[i].x+pts[i+1].x)*0.5, (pts[i].y+pts[i+1].y)*0.5);
    ctx.lineTo(last.x, last.y);
    const cG = ctx.createLinearGradient(pts[0].x, pts[0].y, last.x, last.y);
    cG.addColorStop(0, hsla(this.hue,76,72,0.88)); cG.addColorStop(0.6, hsla(this.hue,76,70,0.38)); cG.addColorStop(1, hsla(this.hue,76,70,0));
    ctx.strokeStyle = cG; ctx.lineWidth = this.width; ctx.stroke();
    ctx.restore();
  }
}

class Jellyfish {
  constructor(x, y, r, hue) {
    this.x = x; this.y = y; this.r = r; this.hue = hue;
    this.phase = rand(0, TAU); this.pulseFreq = rand(0.52, 0.98);
    this.vx = rand(-0.14, 0.14); this.vy = rand(-0.32, -0.14);
    const nOuter = Math.round(r / 4.8 + 7);
    this.outerChains = [];
    for (let i = 0; i < nOuter; i++) {
      const segs = Math.round(rand(14, 24)), segL = r * rand(0.11, 0.17);
      this.outerChains.push(new Chain(segs, segL, rand(0.9, 1.9), hue));
    }
    this.innerChains = [];
    for (let i = 0; i < 4; i++) {
      const segs = Math.round(rand(9, 14)), segL = r * rand(0.17, 0.26);
      this.innerChains.push(new Chain(segs, segL, rand(2.4, 4.0), (hue+18)%360));
    }
  }
  _pulse(t) {
    const raw = Math.sin(t * this.pulseFreq + this.phase);
    const n = (raw + 1) * 0.5;
    return n < 0.5 ? 2*n*n : 1 - Math.pow(-2*n+2, 2)/2;
  }
  update(t) {
    const p = this._pulse(t);
    const swim = Math.max(0, Math.sin(t * this.pulseFreq + this.phase)) * 0.38;
    this.vy -= swim * 0.055;
    this.vy = clamp(this.vy + 0.011, -2.2, 0.6);
    this.vx += (Math.random() - 0.5) * 0.003;
    this.vx = clamp(this.vx, -0.55, 0.55);
    if (mouseActive) {
      const expand = 1 + (p - 0.5) * 0.3;
      const bh = this.r * 0.6 / expand;
      const mdx = this.x - mouseX, mdy = (this.y + bh*0.5) - mouseY;
      const mdist = Math.sqrt(mdx*mdx + mdy*mdy) || 1;
      const repR = this.r * 3.2 + 90;
      if (mdist < repR) {
        const str = (1 - mdist / repR) * 0.9;
        this.vx += (mdx / mdist) * str * 0.18;
        this.vy += (mdy / mdist) * str * 0.18;
      }
    }
    this.x += this.vx + Math.sin(t * 0.22 + this.phase) * 0.11;
    this.y += this.vy;
    if (this.y < -this.r*5)  { this.y = H + this.r*2; this.vy = rand(-0.32,-0.14); }
    if (this.y > H + this.r*2) this.y = -this.r;
    if (this.x < -this.r*2)  this.x = W + this.r;
    if (this.x > W + this.r*2) this.x = -this.r;
    const expand = 1 + (p - 0.5) * 0.3;
    const bw = this.r * expand, bh = this.r * 0.6 / expand;
    const rimY = this.y + bh;
    for (let i = 0; i < this.outerChains.length; i++) {
      const f = i / (this.outerChains.length - 1);
      this.outerChains[i].setAnchor(this.x + (f-0.5)*2*bw*0.92, rimY + Math.sin(f*Math.PI)*bh*0.07);
      this.outerChains[i].update(this.vx * 6);
    }
    for (let i = 0; i < this.innerChains.length; i++) {
      const f = (i + 0.5) / this.innerChains.length;
      this.innerChains[i].setAnchor(this.x + (f-0.5)*2*bw*0.42, rimY - bh*0.08);
      this.innerChains[i].update(this.vx * 3);
    }
  }
  draw(t) {
    const p = this._pulse(t), expand = 1 + (p-0.5)*0.3;
    const bw = this.r * expand, bh = this.r * 0.6 / expand;
    ctx.save();
    ctx.globalAlpha = 0.72; for (const c of this.innerChains) c.draw();
    ctx.globalAlpha = 0.88; for (const c of this.outerChains) c.draw();
    ctx.globalAlpha = 1;
    const haloR = bw * 1.65, hcx = this.x, hcy = this.y + bh*0.5;
    const halo = ctx.createRadialGradient(hcx, hcy, 0, hcx, hcy, haloR);
    halo.addColorStop(0, hsla(this.hue,80,70,0.13)); halo.addColorStop(0.5, hsla(this.hue,80,65,0.05)); halo.addColorStop(1, hsla(this.hue,80,60,0));
    ctx.fillStyle = halo; ctx.fillRect(hcx-haloR, hcy-haloR, haloR*2, haloR*2);
    ctx.translate(this.x, this.y); this._drawBell(bw, bh, p, t);
    ctx.restore();
  }
  _drawBell(bw, bh, p, t) {
    const SEGS = 28, profile = [];
    for (let i = 0; i <= SEGS; i++) {
      const f = i/SEGS, theta = f * Math.PI;
      let px = -bw * Math.cos(theta);
      let py =  bh * (1 - Math.pow(Math.sin(theta), 0.82));
      px += bw * 0.022 * Math.cos(f*7*Math.PI + t*1.7 + this.phase) * Math.sin(theta);
      profile.push({ x: px, y: py });
    }
    const rimL = profile[0], rimR = profile[SEGS], velumY = bh * 0.13;
    const traceDome = () => {
      ctx.moveTo(rimL.x, rimL.y);
      for (let i = 1; i < profile.length-1; i++)
        ctx.quadraticCurveTo(profile[i].x, profile[i].y, (profile[i].x+profile[i+1].x)*0.5, (profile[i].y+profile[i+1].y)*0.5);
      ctx.lineTo(rimR.x, rimR.y);
    };
    ctx.save();
    ctx.shadowColor = hsla(this.hue,92,74,0.95); ctx.shadowBlur = 20 + p*14;
    ctx.beginPath(); traceDome();
    ctx.bezierCurveTo(bw*0.62, bh+velumY, -bw*0.62, bh+velumY, rimL.x, rimL.y);
    ctx.closePath();
    const fg = ctx.createRadialGradient(-bw*0.08,bh*0.18,0,0,bh*0.48,bw*1.1);
    fg.addColorStop(0,    hsla(this.hue+28,68,96,0.88));
    fg.addColorStop(0.38, hsla(this.hue,   78,72,0.62));
    fg.addColorStop(0.78, hsla(this.hue-10,84,54,0.28));
    fg.addColorStop(1,    hsla(this.hue,   80,50,0));
    ctx.fillStyle = fg; ctx.fill(); ctx.restore();
    ctx.save(); ctx.beginPath(); traceDome();
    ctx.strokeStyle = hsla(this.hue,80,88,0.32); ctx.lineWidth = 1.2; ctx.stroke(); ctx.restore();
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    for (let i = 0; i < 8; i++) {
      const cf = i/7, cx = (cf-0.5)*2*bw*0.86;
      const alpha = 0.065 + 0.042*Math.sin(t*1.5+i*0.78+this.phase);
      ctx.beginPath(); ctx.moveTo(cx, bh*0.92);
      ctx.quadraticCurveTo(cx*0.38, bh*0.44, 0, bh*0.06);
      ctx.strokeStyle = hsla(this.hue+18,90,90,alpha); ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.restore();
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    const igR = bw*0.62;
    const ig = ctx.createRadialGradient(0,bh*0.44,0,0,bh*0.44,igR);
    ig.addColorStop(0, hsla(this.hue,95,88,0.18*p)); ig.addColorStop(1, hsla(this.hue,95,80,0));
    ctx.fillStyle = ig; ctx.fillRect(-bw,0,bw*2,bh); ctx.restore();
    ctx.save();
    const sg = ctx.createRadialGradient(-bw*0.24,bh*0.14,0,-bw*0.1,bh*0.3,bw*0.52);
    sg.addColorStop(0,   hsla(this.hue+42,50,98,0.58));
    sg.addColorStop(0.6, hsla(this.hue+20,62,90,0.12));
    sg.addColorStop(1,   hsla(this.hue,   80,80,0));
    ctx.fillStyle = sg; ctx.fillRect(-bw,0,bw*2,bh*0.7); ctx.restore();
    ctx.save(); ctx.shadowColor = hsla(this.hue,92,86,1); ctx.shadowBlur = 6;
    const nDots = Math.round(bw/4.2);
    for (let i = 0; i <= nDots; i++) {
      const f = i/nDots, theta = f*Math.PI;
      const da = 0.38 + 0.30*Math.sin(t*3.2+i*0.52+this.phase);
      ctx.beginPath(); ctx.arc(-bw*Math.cos(theta)*0.97, bh+1.5, 1.25, 0, TAU);
      ctx.fillStyle = hsla(this.hue+10,82,92,da); ctx.fill();
    }
    ctx.restore();
  }
}

const JELLY_DEFS = [
  { xf:0.10, yf:0.72, r:38,  hue:195 },
  { xf:0.88, yf:0.25, r:42,  hue:270 },
  { xf:0.32, yf:0.40, r:48,  hue:255 },
  { xf:0.65, yf:0.85, r:52,  hue:335 },
  { xf:0.55, yf:0.20, r:58,  hue:295 },
  { xf:0.20, yf:0.55, r:68,  hue:210 },
  { xf:0.78, yf:0.60, r:80,  hue:178 },
];

const jellies   = JELLY_DEFS.map(d => new Jellyfish(d.xf*W, d.yf*H, d.r, d.hue));
const particles = Array.from({ length: 130 }, () => new Particle(true));
const bubbles   = Array.from({ length: 26  }, () => new Bubble());

let t0 = performance.now();
function frame(now) {
  const t = (now - t0) / 1000;
  drawBackground(t);
  for (const p of particles) { p.update(); p.draw(); }
  for (const b of bubbles)   { b.update(t); b.draw(); }
  if (mouseActive) {
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    const wg = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 95);
    wg.addColorStop(0,    'rgba(100,210,255,0.07)');
    wg.addColorStop(0.45, 'rgba(80,180,240,0.03)');
    wg.addColorStop(1,    'rgba(60,150,220,0)');
    ctx.fillStyle = wg; ctx.beginPath(); ctx.arc(mouseX, mouseY, 95, 0, TAU); ctx.fill();
    ctx.restore();
  }
  for (const j of jellies) j.update(t);
  for (const j of jellies) j.draw(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
