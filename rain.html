<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雨天動畫</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #020408; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

let W, H, GY;          // canvas dims; GY = ground / water surface Y
let farPts  = [];      // far mountain polygon
let nearPts = [];      // near mountain polygon

/* ─── RESIZE ─── */
function resize() {
  W  = canvas.width  = window.innerWidth;
  H  = canvas.height = window.innerHeight;
  GY = Math.floor(H * 0.67);
  buildMountains();
}

function buildMountains() {
  // Far ridge — gentle peaks, [xFrac, yFrac of GY]
  const fp = [
    [0.05,0.84],[0.11,0.71],[0.18,0.79],[0.26,0.65],
    [0.33,0.73],[0.41,0.63],[0.49,0.72],[0.56,0.77],
    [0.63,0.67],[0.70,0.74],[0.77,0.64],[0.85,0.72],
    [0.91,0.68],[0.97,0.76]
  ];
  farPts = [[0,GY], ...fp.map(([x,y])=>[x*W, y*GY]), [W,GY]];

  // Near ridge — taller, more dramatic
  const np = [
    [0.04,0.82],[0.13,0.57],[0.23,0.74],[0.34,0.50],
    [0.44,0.66],[0.54,0.46],[0.64,0.61],[0.73,0.52],
    [0.82,0.64],[0.90,0.56],[0.97,0.71]
  ];
  nearPts = [[0,GY], ...np.map(([x,y])=>[x*W, y*GY]), [W,GY]];
}

/* ─── RAINDROP ─── */
const ANGLE = 0.13;   // horizontal lean per vertical pixel
const drops = [];

class Drop {
  constructor(spread) { this.reset(spread); }
  reset(spread = false) {
    this.x    = Math.random() * (W + 120);
    this.y    = spread ? Math.random() * H : -40;
    this.sp   = 14 + Math.random() * 11;
    this.ln   = 10 + Math.random() * 16;
    this.a    = 0.15 + Math.random() * 0.32;
    this.hit  = false;
  }
  update() {
    this.y += this.sp;
    this.x -= this.sp * ANGLE;
    // spawn ripple when leading edge touches water
    if (!this.hit && this.y + this.ln >= GY) {
      this.hit = true;
      if (Math.random() < 0.24 && ripples.length < 220)
        ripples.push(new Ripple(this.x, GY));
    }
    if (this.y >= GY) this.reset();
  }
  draw() {
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x - this.ln * ANGLE, this.y + this.ln);
    ctx.strokeStyle = `rgba(175,210,240,${this.a})`;
    ctx.lineWidth = 0.75;
    ctx.stroke();
  }
}

/* ─── RIPPLE ─── */
const ripples = [];

class Ripple {
  constructor(x, y) {
    this.x  = x; this.y = y;
    this.r  = 1;
    this.mr = 16 + Math.random() * 32;
    this.sp = 0.38 + Math.random() * 0.55;
  }
  get alpha() { return 0.52 * Math.max(0, 1 - this.r / this.mr); }
  update()    { this.r += this.sp; return this.r < this.mr; }
  draw() {
    const a = this.alpha;
    if (a <= 0.005) return;
    ctx.beginPath();
    ctx.ellipse(this.x, this.y, this.r, this.r * 0.22, 0, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(140,188,220,${a})`;
    ctx.lineWidth = 0.65;
    ctx.stroke();
  }
}

/* ─── LIGHTNING BOLT ─── */
const bolts = [];
let ltTimer    = 0;
let ltInterval = 4500 + Math.random() * 5000;

class Bolt {
  constructor() {
    const sx = W * 0.15 + Math.random() * W * 0.70;
    this.segs = this._gen(sx, H * 0.02, sx + (Math.random() - 0.5) * 200, GY * 0.56);
    this.a  = 1.0;
    this.fa = 0.45;   // screen-flash alpha
  }
  _gen(x1, y1, x2, y2, d = 0) {
    if (d > 7 || y2 - y1 < 14) return [[x1,y1],[x2,y2]];
    const mx = (x1+x2)/2 + (Math.random()-0.5)*(y2-y1)*0.95;
    const my = (y1+y2)/2;
    return [...this._gen(x1,y1,mx,my,d+1), ...this._gen(mx,my,x2,y2,d+1).slice(1)];
  }
  update() { this.a -= 0.040; this.fa -= 0.028; return this.a > 0; }
  draw() {
    // full-screen flash
    if (this.fa > 0) {
      ctx.fillStyle = `rgba(195,215,255,${Math.max(0,this.fa) * 0.42})`;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.save();
    ctx.shadowBlur  = 30;
    ctx.shadowColor = `rgba(165,200,255,${this.a * 0.9})`;
    ctx.beginPath();
    ctx.moveTo(this.segs[0][0], this.segs[0][1]);
    for (let i = 1; i < this.segs.length; i++)
      ctx.lineTo(this.segs[i][0], this.segs[i][1]);
    ctx.strokeStyle = `rgba(228,242,255,${this.a})`;
    ctx.lineWidth   = 1.8;
    ctx.stroke();
    // bright inner core
    ctx.strokeStyle = `rgba(255,255,255,${this.a * 0.75})`;
    ctx.lineWidth   = 0.5;
    ctx.stroke();
    ctx.restore();
  }
}

/* ─── SCENE DRAW HELPERS ─── */
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, GY);
  g.addColorStop(0,    '#030408');
  g.addColorStop(0.40, '#080f1a');
  g.addColorStop(0.85, '#0c1622');
  g.addColorStop(1,    '#101d2b');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, GY);
}

function drawClouds() {
  const layers = [
    { x:0.10, y:0.04, rx:0.33, ry:0.14, a:0.82 },
    { x:0.50, y:0.02, rx:0.40, ry:0.16, a:0.92 },
    { x:0.86, y:0.05, rx:0.30, ry:0.12, a:0.74 },
    { x:0.27, y:0.11, rx:0.23, ry:0.09, a:0.55 },
    { x:0.70, y:0.09, rx:0.26, ry:0.10, a:0.62 },
  ];
  for (const c of layers) {
    const cx = c.x * W, cy = c.y * H;
    const rx = c.rx * W, ry = c.ry * H;
    const g = ctx.createRadialGradient(cx,cy,0, cx,cy, Math.max(rx,ry));
    g.addColorStop(0,    `rgba(11,17,30,${c.a})`);
    g.addColorStop(0.60, `rgba(7,12,22,${c.a * 0.7})`);
    g.addColorStop(1,    'rgba(3,7,14,0)');
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
  }
}

function drawMountainShape(pts, color) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function drawMist() {
  const g = ctx.createLinearGradient(0, GY - H*0.13, 0, GY + H*0.04);
  g.addColorStop(0,   'rgba(14,28,48,0)');
  g.addColorStop(0.5, 'rgba(14,28,48,0.09)');
  g.addColorStop(1,   'rgba(14,28,48,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, GY - H*0.13, W, H*0.17);
}

function drawWater() {
  const g = ctx.createLinearGradient(0, GY, 0, H);
  g.addColorStop(0,   '#0e1c28');
  g.addColorStop(0.3, '#0a1520');
  g.addColorStop(1,   '#040910');
  ctx.fillStyle = g;
  ctx.fillRect(0, GY, W, H - GY);

  // faint waterline gleam
  ctx.beginPath();
  ctx.moveTo(0, GY); ctx.lineTo(W, GY);
  ctx.strokeStyle = 'rgba(55,105,155,0.22)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawReflection() {
  // mirror the near ridge very faintly into the water
  ctx.save();
  ctx.globalAlpha = 0.10;
  ctx.translate(0, GY * 2);
  ctx.scale(1, -1);
  drawMountainShape(nearPts, '#070e18');
  ctx.restore();
}

/* ─── INIT ─── */
function init() {
  drops.length = 0;
  for (let i = 0; i < 290; i++) drops.push(new Drop(true));
  ltInterval = 4000 + Math.random() * 5000;
}

/* ─── MAIN LOOP ─── */
let prev = 0;

function frame(ts) {
  const dt = Math.min(ts - prev, 50);
  prev = ts;

  ctx.clearRect(0, 0, W, H);

  // — sky & atmosphere
  drawSky();
  drawClouds();

  // — lightning (drawn in sky, behind mountains)
  ltTimer += dt;
  if (ltTimer >= ltInterval) {
    bolts.push(new Bolt());
    ltTimer    = 0;
    ltInterval = 3500 + Math.random() * 6000;
  }
  for (let i = bolts.length - 1; i >= 0; i--) {
    bolts[i].draw();
    if (!bolts[i].update()) bolts.splice(i, 1);
  }

  // — mountains, mist, water
  drawMountainShape(farPts,  '#0f1d2d');
  drawMountainShape(nearPts, '#060d17');
  drawMist();
  drawWater();
  drawReflection();

  // — rain (clipped to sky so drops vanish at water surface)
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, GY); ctx.clip();
  for (const d of drops) { d.update(); d.draw(); }
  ctx.restore();

  // — ripples on water surface
  for (let i = ripples.length - 1; i >= 0; i--) {
    ripples[i].draw();
    if (!ripples[i].update()) ripples.splice(i, 1);
  }

  requestAnimationFrame(frame);
}

/* ─── START ─── */
resize();
init();
requestAnimationFrame(frame);
window.addEventListener('resize', () => { resize(); init(); });
</script>
</body>
</html>
